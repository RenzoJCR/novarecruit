spring.application.name=backend

# Permite que Azure defina el puerto dinámicamente, manteniendo el 8080 en local
server.port=${PORT:8080}

# Parametrización de la conexión a la base de datos
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:novarecruit_db}?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Antony03}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT
jwt.secret=${JWT_SECRET:novarecruit-secret-key-change-this}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Bootstrap temporal de datos base
app.bootstrap.enabled=${APP_BOOTSTRAP_ENABLED:true}