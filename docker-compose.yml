services:
  mysql:
    image: mysql:8.4
    container_name: novarecruit-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: America/Lima
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - novarecruit-net
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "${MYSQL_USER}",
          "-p${MYSQL_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: novarecruit-backend
    restart: always
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED}
      FRONTEND_URL: ${FRONTEND_URL}
      TZ: America/Lima
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - novarecruit-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: novarecruit-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - novarecruit-net

volumes:
  mysql_data:

networks:
  novarecruit-net:
    driver: bridge